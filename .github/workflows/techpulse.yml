name: TechPulse Daily

on:
  schedule:
    # 01:30 UTC == 07:00 Asia/Kolkata (target morning briefing; GitHub may delay cron slightly)
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Override report date YYYY-MM-DD (Asia/Kolkata, for testing/recovery)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: Engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r Engine/requirements.txt
        working-directory: Engine
      - name: Run tests
        run: python -m pytest tests -q
        working-directory: Engine
      - name: Run TechPulse
        working-directory: Engine
        env:
          OUTPUT_TOKEN: ${{ secrets.OUTPUT_TOKEN }}
          OUTPUT_REPOSITORY: just-userhere/Output
          GIT_AUTHOR_NAME: just-userhere
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
          TARGET_DATE: ${{ inputs.target_date }}
          TIMEZONE: Asia/Kolkata
          PYTHONPATH: src
        run: |
          echo "Target timezone: Asia/Kolkata"
          echo "Target publication time: 07:00 IST"
          echo "UTC schedule: 01:30 UTC"
          python -m techpulse --live ${TARGET_DATE:+--target-date "$TARGET_DATE"}
