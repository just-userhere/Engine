timezone: Asia/Kolkata
news_minimum: 1
news_maximum: 5
freshness_window_hours: 72
duplicate_threshold: 0.82
state_max_entries: 2000
output_repository: just-userhere/Output

weights:
  industry_impact: 0.25
  developer_relevance: 0.25
  novelty: 0.15
  source_reliability: 0.15
  freshness: 0.10
  trend_momentum: 0.10

sources:
